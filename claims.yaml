- id: s-exotic
  kind: source
  passage: For singular spherical varieties an established approach replaces the characteristic function of integral
    points by an exotic basic function built from intersection cohomology of arc spaces, whose local factors recover
    $L$-values [@braverman1999; @sakellaridis2012; @bouthier2016; @sakellaridis2022].
  evidence:
    citation_id: bouthier2016
    locator: Abstracts; [CV] §1.4
    verification_note: Abstracts read for bouthier2016, sakellaridis2022 (intersection complexes of arc spaces,
      basic function as generating function of local unramified L-functions), braverman1999 (Schwartz space of the
      basic affine space), sakellaridis2012; framing follows [CV, §1.4].
    verified: true
- id: s-naive
