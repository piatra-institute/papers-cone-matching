- id: d-coords
  kind: definition
  passage: In these coordinates $$R(x) := \langle\chi,\rho\rangle = \sum_\beta n_\beta x_\beta,\qquad \langle\chi,\rho-\alpha\rangle
    = R(x) - x_\alpha,\qquad W_\alpha(x) := \frac{\langle\chi,\varpi_\alpha\rangle}{m_\alpha} = \frac{\sum_\beta
    c_{\alpha\beta}x_\beta}{\sum_\beta c_{\alpha\beta}}.$$ Every $c_{\alpha\beta}$ is nonnegative, so $W_\alpha$
    is a weighted mean of the $x_\beta$.
  rationale: Definitions of Section 2.2; nonnegativity of the inverse Cartan matrix of a finite root system.
- id: s-55
  kind: source
