- id: s-bzsv
  kind: source
  passage: Relative Langlands duality, proposed by Ben-Zvi, Sakellaridis and Venkatesh, pairs a Hamiltonian space
    for a reductive group $G$ with a Hamiltonian space for its dual group $\check G$, so that periods of automorphic
    forms on one side correspond to $L$-functions attached to the other [@benzvi2024].
  evidence:
    citation_id: benzvi2024
    locator: Abstract and §1
    verification_note: 'arXiv abstract read: pairs a Hamiltonian space for G with one for the dual group and recovers
      at a numerical level the period/L-function relationship; arithmetic analogue of electric-magnetic duality
      of boundary conditions.'
    verified: true
- id: s-feng
  kind: source
  passage: Its ingredients include the dual groups attached to spherical varieties [@sakellaridis2017; @knop2017],
    and categorical forms of its conjectures have been tested in low-rank cases [@feng2025].
  evidence:
    citation_id: feng2025
    locator: Abstract
    verification_note: 'Crossref abstract read: evidence for BZSV categorical conjectures in low-rank examples via
      derived Fourier analysis and chiral algebras.'
    verified: true
- id: s-knop
  kind: source
  passage: Its ingredients include the dual groups attached to spherical varieties [@sakellaridis2017; @knop2017],
