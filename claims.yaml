- id: s-cv71
  kind: source
  passage: 'Their Theorem 7.1 shows that two pairs of singular spaces satisfy a numerical form of the duality: for
    $G = \mathrm{PGL}_3\times\mathbb{G}_m$ the space $X$ is the nilpotent cone of $3\times 3$ matrices, and one
    of the two identities is essentially Ginzburg''s integral representation of the adjoint $L$-function of $\mathrm{GL}_3$
    [@ginzburg1991]; for a group isogenous to $\mathrm{SL}_2^3\times\mathbb{G}_m$ the space $X$ consists of $(2,2,2)$-tensors
    of vanishing hyperdeterminant, and one identity is essentially Garrett''s integral representation of the triple
    product $L$-function [@garrett1987].'
  evidence:
    citation_id: chen2026
    locator: Theorem 7.1, §1.1, §6
    verification_note: 'arXiv v1 read in full (Sections 1, 4-7); journal version consulted through the publisher
      page for Proposition 5.1, (57), (66), (70), Remark 7.4 and §6.5, which agree with arXiv v1. Theorem 7.1: Ginzburg
      case PGL3 x Gm / SL3 x Gm and Garrett case (51)/(53), discrepancy 3.'
    verified: true
