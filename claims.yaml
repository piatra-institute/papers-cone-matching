    for any $G$ as above with $\kappa > 1$.
  evidence:
    citation_id: chen2026
    locator: Proposition 5.5, (64)-(66), Proposition 7.3
    verification_note: CV Proposition 5.5, (45)-(46), (62)-(66) and Proposition 7.3 read in arXiv v1.
    verified: true
- id: s-58
  kind: source
  passage: We call the set of real $\chi$ satisfying them with $x\ge 0$ the automorphic cone $$\mathcal{A} = \left\{x\ge
    0,\ \ \frac{R}{\kappa-1}\ \ge\ z\ \ge\ \max\Big(\max_\alpha\frac{R - x_\alpha}{\kappa-1},\ \max_\alpha W_\alpha\Big)\right\}.$$
    Dropping the inequalities $z\ge W_\alpha$ gives the simplified cone $$\mathcal{B} = \left\{x\ge 0,\ \ \frac{R}{\kappa-1}\
    \ge\ z\ \ge\ \max_\alpha\frac{R - x_\alpha}{\kappa-1}\right\},$$ which is the form (58) that the automorphic
    inequalities take in the published examples, where the inequalities $z \ge W_\alpha$ follow from the others
    because each $\varpi_\alpha/m_\alpha$ lies in the convex hull of the points $(\rho-\beta)/(\kappa-1)$ [@chen2026,
    §7.1(2)].
  evidence:
    citation_id: chen2026
    locator: §7.1(2), (58)
    verification_note: 'CV §7.1(2): points n^{-1} varpi lie in the convex hull of (rho - alpha)/(a-1); (66) reduces
      to (58).'
    verified: true
