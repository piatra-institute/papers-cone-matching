- id: abs-cone
  kind: interpretation
  passage: The two cones coincide exactly when, in addition, the integer $d = \langle\theta_G,\nu_G\rangle$ pairing
    the primitive central character with the primitive central cocharacter equals $1/(\kappa-1)$, where $\kappa
    = \langle\rho,\check\rho\rangle$; this leaves $A_2$ with $d=1$ and $A_1^3$ with $d=2$.
  rationale: Lemma 2 and Corollary 4, proved in Sections 2.4 and 3.2; check cone_matching_exactly_A2_A1^3.
