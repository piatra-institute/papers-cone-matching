web_blurb: 'In two singular examples of relative Langlands duality, integrality inequalities on one side
  match the weights of functions on the other. Classifying when this happens separates three conditions:
  a convex reduction that holds for root types A₂, B₂, G₂ and A₁³, an integral central calibration that
  leaves A₂ and A₁³, and an integrality condition on the shifted cocharacter that only some global forms
  satisfy.'
