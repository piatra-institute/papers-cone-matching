abstract: 'Chen and Venkatesh proved that two pairs of singular spaces, built from the nilpotent cone
  of $3\times 3$ matrices and from $(2,2,2)$-tensors of vanishing hyperdeterminant, are numerically weakly
  dual in the sense of relative Langlands duality. The decisive step of their proof is that the inequalities
  describing integral points of one space coincide with the inequalities describing the weights of regular
  functions on the other. They attribute this to coincidences specific to their groups and expect the
  underlying convex reduction to occur only for groups isogenous to their examples. We analyse the same
  comparison for every split reductive group with one-dimensional centre. The automorphic inequalities
  reduce in this way for the root types $A_2$, $B_2$, $G_2$ and $A_1^3$ and for no others. The two cones
  coincide exactly when, in addition, the integer $d = \langle\theta_G,\nu_G\rangle$ pairing the primitive
  central character with the primitive central cocharacter equals $1/(\kappa-1)$, where $\kappa = \langle\rho,\check\rho\rangle$;
  this leaves $A_2$ with $d=1$ and $A_1^3$ with $d=2$. Equal cones need not index equal sets of representations.
  The description of the coordinate ring that the comparison uses requires the extra condition $\langle\lambda,\check\rho''\rangle\in\mathbb{Z}$
  when the shifted cocharacter $\check\rho''$ is only rational, and with it the two supports agree if
  and only if the shifted cocharacter of the dual group is integral. Of the 35 labelled global forms of
  type $A_1^3$ with $d=2$, five pass the test for both identities: the published pair and three copies
  of the self-dual group $\mathrm{SO}_4\times\mathrm{GL}_2$. Exact computer checks cover all root types
  up to rank 8. No new period identity is proved.'
